[package]
name = "effect-sql-postgres"
version = "0.0.1"
description = "sqlx::PgPool driver for effect-sql"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
effect-sql = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
