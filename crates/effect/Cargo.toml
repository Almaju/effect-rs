[package]
name = "effect"
version = "0.0.1"
description = "A functional effect framework for Rust, inspired by Effect-TS"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
async-channel = { workspace = true }
effect-data = { workspace = true }
effect-macros = { workspace = true }
effect-schema = { workspace = true }
# Note: effect-stream is NOT re-exported here because it depends on
# the `effect` crate itself (Stream terminals return Effect). Users
# of streams add `effect-stream` as a separate workspace/Cargo dep.

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
